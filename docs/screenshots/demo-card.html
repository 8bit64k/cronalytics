<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronalytics Demo Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 1280px;
      height: 720px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 40px;
      border: 3px solid #e5e5e5;
    }
    .title {
      font-size: 120px;
      font-weight: 800;
      color: #111111;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .phonetic {
      font-size: 24px;
      color: #666666;
      font-weight: 400;
      margin-bottom: 40px;
      font-style: italic;
    }
    .tagline {
      font-size: 32px;
      color: #333333;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
      max-width: 900px;
    }
    .divider {
      width: 80px;
      height: 4px;
      background: #111111;
      margin: 40px 0;
      border-radius: 2px;
    }
    .actions {
      font-size: 28px;
      color: #555555;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .footer {
      position: absolute;
      bottom: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      color: #888888;
    }
    .footer img {
      width: 28px;
      height: 28px;
      opacity: 0.6;
    }
    .github-icon {
      fill: #888888;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://avatars.githubusercontent.com/u/277917462?v=4" alt="8bit64k">
    
    <div class="title">Cronalytics</div>
    <div class="phonetic">/ˈkrɒn.əˌlɪt.ɪks/ &nbsp;(noun)</div>
    
    <div class="tagline">
      Cron analytics and observability.<br>
      The dashboard for agentic automations in Hermes.
    </div>
    
    <div class="divider"></div>
    
    <div class="actions">Observe. Measure. Optimize.</div>
    
    <div class="footer">
      <svg height="28" width="28" viewBox="0 0 16 16" class="github-icon">
        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
      </svg>
      <span>github.com/8bit64k/cronalytics</span>
    </div>
  </div>
</body>
</html>
